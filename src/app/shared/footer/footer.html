<!-- Public-site footer. Admin routes render their own SecureX Operations workspace. -->
<footer class="bg-blue-900 border-t border-blue-800 mt-auto">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row justify-center items-center gap-3 text-sm flex-wrap">
      <span class="text-blue-300">&copy; 2026 SecureX. All rights reserved.</span>
      <span class="text-blue-600 hidden sm:inline">|</span>
      <div class="flex items-center gap-3 flex-wrap">
        <a routerLink="/terms" class="text-blue-200 hover:text-white transition-colors cursor-pointer hover:underline">Terms &amp; Conditions</a>
        <span class="text-blue-600">|</span>
        <a routerLink="/faq" class="text-blue-200 hover:text-white transition-colors cursor-pointer hover:underline">FAQ</a>
        <span class="text-blue-600">|</span>
        <a
          [routerLink]="auth.isAdmin() ? '/admin/dashboard' : '/admin'"
          class="flex items-center justify-center w-8 h-8 bg-blue-700 hover:bg-blue-600 rounded-full transition-all duration-200 hover:scale-110 hover:shadow-lg"
          title="Admin Portal">
          <img src="/favicon.png" alt="Admin" class="h-5 w-5 rounded" />
        </a>
      </div>
    </div>
  </div>
</footer>
